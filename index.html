<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner de Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    
    <style>
        :root {
            --azul-oscuro: #2f517e;
            --naranja: #e3801e;
            --gris-texto: #6b7280;
            --gris-fondo: #f3f4f6;
            --blanco: #ffffff;
            --rojo-salida: #c0392b;
        }

        body { font-family: 'Poppins', sans-serif; text-align: center; padding: 15px; background-color: var(--gris-fondo); margin: 0; color: var(--azul-oscuro); -webkit-tap-highlight-color: transparent; }
        .contenedor { max-width: 400px; margin: 0 auto; background: var(--blanco); padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(47, 81, 126, 0.15); }
        h2 { margin-top: 0; font-weight: 600; font-size: 22px; }
        label { display: block; text-align: left; font-size: 13px; font-weight: 500; color: var(--gris-texto); margin-bottom: 5px; padding-left: 5px; }
        input { padding: 12px; font-size: 16px; width: 90%; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-family: 'Poppins', sans-serif; color: var(--azul-oscuro); outline: none; }
        input:focus { border-color: var(--azul-oscuro); }
        button { padding: 15px; font-size: 16px; font-weight: 600; margin: 8px 0; border: none; border-radius: 8px; color: var(--blanco); cursor: pointer; width: 100%; font-family: 'Poppins', sans-serif; transition: transform 0.1s; }
        button:active { transform: scale(0.97); }

        .btn-entrada { background-color: var(--azul-oscuro); }
        .btn-salida { background-color: var(--naranja); }
        .btn-detener { background-color: var(--rojo-salida); margin-top: 15px; }
        .btn-manual { background-color: var(--gris-texto); font-size: 14px; padding: 12px; margin-top: 0;}
        
        /* Botones nuevos de acción */
        .btn-escanear { background-color: var(--azul-oscuro); font-size: 16px; margin-bottom: 10px;}
        .btn-ocr { background-color: #8e44ad; font-size: 14px; padding: 12px; margin-top: 5px;}
        
        #reader { width: 100%; margin: 10px 0; display: none; border-radius: 8px; overflow: hidden; border: 2px solid var(--gris-fondo); }
        #mensaje { margin-top: 15px; font-weight: 500; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
        .exito { background-color: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
        .error { background-color: #fce8e6; color: #d93025; border: 1px solid #fad2cf; }
        
        #lista-escaneados { margin-top: 15px; text-align: left; font-size: 12px; color: var(--gris-texto); display: none; max-height: 150px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; background: var(--blanco);}
        #lista-escaneados ul { margin: 0; padding-left: 20px; }
        #lista-escaneados li { margin-bottom: 4px; font-weight: 500; color: var(--azul-oscuro); }

        #seccion-acciones { display: none; margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px; }
        #foto-input { display: none; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Control de Inventario</h2>
        
        <div id="pantalla-inicio">
            <label>Nombre del Operario:</label>
            <input type="text" id="operario" placeholder="Ej: Juan Pérez" required>
            
            <button class="btn-entrada" onclick="iniciarTanda('ENTRADA')">📥 Registrar Entrada</button>
            <button class="btn-salida" onclick="iniciarTanda('SALIDA')">📤 Registrar Salida</button>
        </div>
        
        <!-- Pantalla de escaneo activo -->
        <div id="pantalla-escaneo" style="display:none;">
            <div id="reader"></div>
            
            <!-- Aquí están las opciones manuales y de cámara -->
            <div id="seccion-acciones">
                <button class="btn-escanear" onclick="abrirCamaraBarras()">📷 Escanear con Cámara</button>
                
                <label style="margin-top: 15px;">O escribe el serial manual:</label>
                <input type="text" id="serial-manual" placeholder="Escribe el código aquí">
                <button class="btn-manual" onclick="guardarManual()">Guardar este Serial</button>
                
                <input type="file" id="foto-input" accept="image/*" capture="environment">
                <button class="btn-ocr" onclick="document.getElementById('foto-input').click()">🧠 Leer Código Roto (IA)</button>
            </div>

            <!-- Listado de lo que se lleva en esta tanda -->
            <div id="lista-escaneados">
                <strong>Guardados en esta tanda:</strong>
                <ul id="ul-escaneados"></ul>
            </div>

            <button id="btn-detener" class="btn-detener" onclick="detenerTanda()">🛑 Terminar y Guardar</button>
        </div>

        <div id="mensaje"></div>
    </div>

    <script>
        const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwoHIKKmGAPbsWeDALqhDCa3_O8JRepcc-3Ryfjq3tTeBbWiHetwx7SIsNH030dGVc0XA/exec';
        
        let html5QrCode = null;
        let tipoMovimiento = '';
        let operarioActual = '';
        let listaSeriales = []; // Aquí guardamos lo que llevamos escaneado
        
        document.getElementById('operario').value = localStorage.getItem('operarioInv') || '';

        function iniciarTanda(tipo) {
            operarioActual = document.getElementById('operario').value.trim();
            if (!operarioActual) { alert('Por favor, escribe el nombre del operario.'); return; }
            localStorage.setItem('operarioInv', operarioActual); 

            tipoMovimiento = tipo;
            listaSeriales = []; // Reiniciar la lista
            
            // Mostrar pantalla de escaneo, ocultar inicio
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('pantalla-escaneo').style.display = 'block';
            document.getElementById('lista-escaneados').style.display = 'block';
            document.getElementById('ul-escaneados').innerHTML = '';
            document.getElementById('mensaje').style.display = 'none';
            document.getElementById('serial-manual').value = '';
        }

        // Función que enciende la cámara SOLO cuando se presiona el botón
        function abrirCamaraBarras() {
            document.getElementById('reader').style.display = 'block';
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    if (navigator.vibrate) navigator.vibrate(100);
                    // Al leer con éxito, apagamos la cámara
                    html5QrCode.stop().then(() => {
                        document.getElementById('reader').style.display = 'none';
                        html5QrCode.clear();
                    });
                    procesarSerial(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => { alert('Error al abrir cámara: ' + err); });
        }

        // IA para códigos rotos
        document.getElementById('foto-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.style.display = 'block';
            mensajeDiv.className = '';
            mensajeDiv.style.backgroundColor = '#e5e7eb';
            mensajeDiv.style.color = '#374151';
            mensajeDiv.innerText = '🧠 La IA está leyendo el código roto...';

            try {
                const { data: { text } } = await Tesseract.recognize(file, 'eng');
                // Buscamos solo los números en el texto que devuelve la IA
                const serialLeido = text.match(/\d{6,20}/); 
                
                if (serialLeido) {
                    mensajeDiv.innerText = '📖 Número detectado: ' + serialLeido[0] + '. Enviando...';
                    procesarSerial(serialLeido[0]);
                } else {
                    mensajeDiv.className = 'error';
                    mensajeDiv.innerText = '❌ No se pudo encontrar un número válido. Intenta manual.';
                }
            } catch (error) {
                mensajeDiv.className = 'error';
                mensajeDiv.innerText = '❌ Error al procesar la imagen.';
            } finally {
                e.target.value = ''; 
            }
        });

        function guardarManual() {
            const inputSerial = document.getElementById('serial-manual');
            const serial = inputSerial.value.trim();
            if (!serial) { alert("Escribe un serial válido."); return; }
            procesarSerial(serial);
            inputSerial.value = '';
            inputSerial.focus();
        }

        function procesarSerial(serial) {
            // FILTRO DE SEGURIDAD: Evitar códigos QR gigantes
            if (serial.length > 25 || serial.length < 5) {
                alert('⚠️ El código es muy corto o muy largo. Revisa el producto.');
                return;
            }

            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.style.display = 'block';
            mensajeDiv.className = '';
            mensajeDiv.style.backgroundColor = '#e5e7eb';
            mensajeDiv.style.color = '#374151';
            mensajeDiv.innerText = 'Verificando: ' + serial + '...';

            const payload = { serial: serial, tipo: tipoMovimiento, operario: operarioActual };

            fetch(URL_APPS_SCRIPT, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                // Agregar a la lista visual
                listaSeriales.push(serial);
                document.getElementById('ul-escaneados').innerHTML += '<li>' + serial + '</li>';
                
                mensajeDiv.className = 'exito';
                mensajeDiv.style.backgroundColor = '';
                mensajeDiv.innerText = '✅ Guardado: ' + serial;
            }).catch((error) => {
                mensajeDiv.className = 'error';
                mensajeDiv.innerText = '❌ Error al guardar: ' + serial;
            });
        }

        function detenerTanda() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(e => console.log(e));
            }
            document.getElementById('reader').style.display = 'none';
            document.getElementById('pantalla-escaneo').style.display = 'none';
            document.getElementById('pantalla-inicio').style.display = 'block';
            
            if (listaSeriales.length > 0) {
                document.getElementById('mensaje').className = 'exito';
                document.getElementById('mensaje').innerText = '✅ Tanda terminada. Guardados: ' + listaSeriales.length;
            }
        }
    </script>
</body>
</html>
